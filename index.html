<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강사 명함 발급</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>강사 명함 발급</h1>
  <p class="sub">강사 이름(영문)을 입력하면 명함이 만들어집니다.</p>

  <section class="panel">
    <label for="names">강사명 <span>(여러 명은 줄바꿈으로 구분)</span></label>
    <textarea id="names" rows="4" placeholder="예) Selly"></textarea>
    
  </section>

  <section class="panel" id="preview" hidden>
    <canvas id="card" width="1063" height="591"></canvas>
    <div id="tabs"></div>
    <div class="buttons">
      <button id="png">PNG로 저장</button>
      <button id="pdf">PDF로 저장</button>
      <button id="zip" hidden>전체 ZIP으로 저장 (PNG)</button>
    </div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="script.js"></script>
</body>
</html>
